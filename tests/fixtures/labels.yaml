# Gesture labels for the recorded clips (Phase 4). This is the ONLY file under tests/fixtures/ that is committed;
# the clips themselves are local-only (recordings/ or tests/fixtures/, both gitignored). Written by
# `python -m incanto --record-guided <plan>`.
# Times are seconds from the clip's first video frame. cue_time = when the guide beeped; event_time = when the gesture
# really happened (people react 0.5-1.3 s late): Phase 5 evaluation uses event_time, and a detection counts if it lands
# within event_time +- tolerance_s. After a recording, run scripts/retime_labels.py to set event_time from the recording
# (until then event_time = cue_time and method says so). alt_event_times = further genuine onsets in the same window.
# dropped lists cues left out of gestures, with the reason. holds are intervals in which a pose stays up: a detector must fire
# at most max_fires (1) times per hold. Scoring: a detection within tolerance_s of event_time OR of any alt_event_time is a
# hit, and a second detection matching an alt time is NOT a false positive. no_gesture_segments are talk-with-your-hands
# stretches in which nothing may fire.
