video:
  width: 1280
  height: 720
  fps: 30
  perception_width: 640        # downscaled for detection

models:                        # fetched by scripts/download_models.py
  hand_landmarker: models/hand_landmarker.task
  selfie_segmenter: models/selfie_segmenter_landscape.tflite

perception:
  num_hands: 2
  hand_min_detection_confidence: 0.5
  hand_min_presence_confidence: 0.5
  hand_min_tracking_confidence: 0.5
  mask_blur_px: 5              # Gaussian kernel size on the perception-res mask (0 = off)
  mask_feather_low: 0.35       # confidence at/below this -> 0
  mask_feather_high: 0.65      # confidence at/above this -> 1 (smooth in between)
  mask_temporal_alpha: 0.6     # weight of the new mask vs the previous one (1 = no smoothing)
  segment_every_n: 1           # run segmentation every Nth frame, reuse the last mask otherwise

vcam:
  backend: obs                 # obs | unitycapture

mappings:                      # gesture → spell
  snap: vanish
  clap: backdrop_swap
  thumbs_up: confetti

triggers:
  global_cooldown_s: 3.0
  min_confidence: 0.8

gestures:
  snap:
    audio_peak_db: -18
    audio_decay_ms: 60
    hand_raised_required: true
  clap:
    max_wrist_distance: 0.08   # normalized
    min_approach_speed: 1.5

spells:
  vanish:
    particle_size_px: 4
    duration_s: 1.6
    drift: [1.0, -0.3]         # right and slightly up
    stagger: left_to_right
