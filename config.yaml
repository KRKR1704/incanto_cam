video:
  width: 1280
  height: 720
  fps: 30
  perception_width: 640        # downscaled for detection
  capture_mode: threaded       # inline | threaded (background thread holds the latest frame)

models:                        # fetched by scripts/download_models.py
  hand_landmarker: models/hand_landmarker.task
  selfie_segmenter: models/selfie_segmenter_landscape.tflite

perception:
  num_hands: 2
  hand_min_detection_confidence: 0.5
  hand_min_presence_confidence: 0.5
  hand_min_tracking_confidence: 0.5
  mask_blur_px: 5              # Gaussian kernel size on the perception-res mask (0 = off)
  mask_feather_low: 0.35       # confidence at/below this -> 0
  mask_feather_high: 0.65      # confidence at/above this -> 1 (smooth in between)
  mask_temporal_alpha: 0.6     # weight of the new mask vs the previous one (1 = no smoothing)
  mask_temporal: attack_release  # attack_release: mask = max(current, previous * decay), so it grows
                               # instantly and shrinks slowly; symmetric: the old alpha blend
  mask_release_decay: 0.85     # attack_release: how much of the previous mask survives each frame
  segment_every_n: 1           # run segmentation every Nth frame (every frame: vanish needs a fresh mask;
                               # 2 was needed in Phase 2 when hands ran inline, now they run on a thread)
  hands_async: true            # hand tracking on its own thread, always on the latest frame

camera:
  exposure: auto                # auto | a number in log2 seconds, e.g. -6 (1/64 s). Manual exposure
                               # keeps the camera at 30 fps in dim rooms; [ and ] nudge it while running

preview:
  every_n: 3                   # update the preview window every Nth frame (vcam output is every frame); 2 costs ~2 FPS more
                               # with the vanish debug views (preview drawing is ~8-13 ms per shown frame)

vanish:                        # the mask used when V replaces you with the plate. Over-covering is free,
                               # under-covering shows you, so everything is biased toward covering.
  mask_mode: full              # seg_only | seg_hands | full (segmenter + hand hulls + plate difference)
  dilate_px: 15                # grow the segmenter mask (px at 1280 wide)
  hand_hull_dilate_px: 25      # grow each hand's filled convex hull (landmarks are ~50 ms old)
  core_threshold: 0.1          # a pixel is "covered" (alpha exactly 1.0) if ANY source exceeds this
  core_close_px: 15            # close pinholes in the solid core
  outer_feather_px: 12         # blend ring OUTSIDE the solid core only, so the soft edge never overlaps you
  plate_diff_metric: max_channel  # gray | max_channel | lab: how |live - matched plate| is measured
                               # (gray missed 90% of the leaking pixels near me: similar brightness, other colour)
  plate_diff_threshold: 28     # levels of difference counted as "not background"
  plate_diff_open_px: 3        # morphological open on the difference mask (remove speckle)
  plate_diff_close_px: 9       # morphological close (fill holes)
  plate_diff_release_decay: 0.8  # fast attack, slow release for the difference mask and the near-me zone
  plate_diff_large_blob_fraction: 0.05  # a difference this big (fraction of the frame) counts anywhere, so a
                               # segmenter dropout cannot expose you; 0 = plate difference only near me
  plate_diff_cell_guard: true  # per grid cell: ignore the difference where a neutral lighting gain explains it
  plate_diff_wash_fraction: 0.85  # guard: cell is a "wash" if this much of its uncovered pixels differ...
  plate_diff_wash_residual: 12.0  # ...and one neutral gain explains the cell to within this many levels
  near_me_px: 70               # plate difference only counts this far around the mask; moved objects
                               # elsewhere stay live
  plate_match: gain_map        # off | gain | gain_offset (one global correction) | gain_map (per-cell gain grid)
  plate_match_cells_x: 8       # gain_map grid
  plate_match_cells_y: 6
  plate_match_smoothing: 0.15  # weight of each frame's estimate in the running gain/offset
  match_margin_px: 30          # background used for matching lies this far outside the mask

plate:                         # clean plate of the empty room (plates/ is local-only, gitignored)
  frames: 30                   # frames averaged into the plate
  countdown_s: 3.0             # preview-only countdown after pressing B: time to leave the frame
  settle_s: 1.0                # extra wait for auto exposure to settle on the empty room
  max_person_coverage: 0.02    # abort the capture if the person mask covers more than this fraction
  dir: plates

vcam:
  backend: obs                 # obs | unitycapture

mappings:                      # gesture → spell
  snap: vanish
  clap: backdrop_swap
  thumbs_up: confetti

triggers:
  global_cooldown_s: 3.0
  min_confidence: 0.8

gestures:
  snap:
    audio_peak_db: -18
    audio_decay_ms: 60
    hand_raised_required: true
  clap:
    max_wrist_distance: 0.08   # normalized
    min_approach_speed: 1.5

spells:
  vanish:
    particle_size_px: 4
    duration_s: 1.6
    drift: [1.0, -0.3]         # right and slightly up
    stagger: left_to_right
